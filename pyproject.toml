[project]
name = "vena"
version = "0.1.0"
description = "Detection of anomalies in chest radiographs via classification, regression, and clustering using DenseNet121"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy<2.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "umap-learn>=0.5.12",
]
